services:
  - type: web
    name: pain-point-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MCP_SERVER_SECRET
        sync: false
      - key: REDDIT_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_TRANSCRIPT_API_KEY
        sync: false
      - key: TWITTERAPI_IO_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
